# One GitHub repository, maintained: issues worked in branches and opened as
# PRs, outside PRs reviewed (never merged), Warden's own PRs, Dependabot's and
# trusted delegates' merged on green CI, patch/minor releases cut from merged
# PR titles, and once a week a roadmap of its own (ROADMAP.md and a few
# issues; architecture changes as RFCs that wait for an objection). Hard
# limits in code: the kill switch (a `warden-pause` label or a PAUSE file on
# main) is read first every tick; issue and PR text is untrusted
# data and never drives a merge or a release; the human-only kernel (CI,
# release config, this pack, Warden's config, policy, budget, sandbox, guard;
# internal/github/kernel.go) and other protected paths always go to the owner
# (needs-human), never merged by Warden; external code never runs here; a
# daily model budget.
# The token comes from a file (a fine-grained PAT for this one repository,
# without the workflows or administration permissions).
name        = "github-repo"
description = "A GitHub repository: works issues into PRs, reviews outside PRs, merges its own on green CI, cuts patch/minor releases"

[params]
repo        = ""                         # owner/name
token_file  = ""                         # the fine-grained PAT, one line, chmod 600 (never in argv, env dumps or logs)
owner       = ""                         # the GitHub login Warden pings
root        = "repo"                     # a local clone (made on first use) — worktrees come from it
api         = "https://api.github.com"
branch      = "main"
checks_mode = "ci"                       # ci: no repository code runs here, CI decides; local: run `checks` in the sandbox
checks      = '["go vet ./...", "go test -race -count=1 ./...", "GOLANGCI_LINT_CACHE=$TMPDIR/golangci golangci-lint run ./..."]'
required_checks    = ""                  # check names that must be present and green (default: every reported check green). Warden merges with no human review,
                                         # so list the quality gates too: at least "coverage" and "fuzz" (and lint, test (…), govulncheck, demos (…))
protected          = ""                  # extra globs on top of the human-only kernel (which no config removes)
protected_names    = "signing,signature,cosign,gpg" # extra words in a file name (secret, credential, token are kernel)
max_issues_per_day = "3"
trusted_authors    = ""                  # logins whose PRs merge under Warden's own rules (the owner's other agents)
release            = "auto"              # auto | off
canary             = ""                  # a fleet instance (update.channel = "canary"): tag vX.Y.Z-rc.N first, vX.Y.Z on the same commit once it ran healthy
canary_hours       = "24"                # how long the canary runs the rc healthy before the final tag
canary_min_ticks   = "6"                 # and at least this many healthy ticks (its beacon on the "Warden fleet" issue)
canary_stale_hours = "3"                 # a beacon not rewritten for this long is a silent canary: no final tag
small_labels       = ""                  # default: small, good first issue, docs, chore, dependencies
delegate_cmd       = ""                  # an argv template (JSON array) handing an issue to another agent: {title} {body} {agent} {issue} {url} {repo}
delegate_labels    = ""                  # label → agent, e.g. { infra = "Ops" }
delegate_default   = ""                  # the agent for hard issues when no paid brain may take them
pickup_branches    = ""                  # branch prefixes a delegate pushes to; Warden opens the PR
pause_label        = "warden-pause"
experiment_log     = "on"                # on: every task (an issue worked across ticks) is recorded in <state>/tasks.jsonl and published daily (publish-log)
experiment_doc     = "docs/experiment-27b.md"  # where publish-log writes the log (never a protected path)
experiment_tz      = ""                  # the IANA zone for the log's days and weeks (default: the machine's), e.g. Europe/Moscow
experiment_context_tokens = "262144"  # the coding model's context: a failed attempt whose prompt reached 90% of it counts context-limit
experiment_acts    = ""                  # acts whose results are task records (default: work-issue, merge-pr, pickup-branch)
review_brain       = ""                  # a brain name: a second model reviews Warden's own issue PRs before merge-pr merges them ("" = off)
roadmap            = "on"                # on | off: the weekly roadmap (ROADMAP.md as a PR, a few issues) and the RFC timer
roadmap_day        = "mon"               # the weekday (in roadmap_tz) from which the week's roadmap is due
roadmap_tz         = "Europe/Moscow"
roadmap_max_issues = "3"                 # issues the roadmap may open per week (duplicates of open issues skipped)
rfc_wait_hours     = "72"                # an RFC Warden opened gets the warden label after this long with no objection
# Ecosystem news for the roadmap: titles and links from the last 14 days only.
# MCP spec and registry, A2A, Agent Skills, ACP, the Go blog, Renovate,
# Dependabot, OpenHands. Go advisories come from OSV in the other packs.
roadmap_feeds      = '''["https://github.com/modelcontextprotocol/modelcontextprotocol/releases.atom",
  "https://github.com/modelcontextprotocol/registry/releases.atom",
  "https://github.com/a2aproject/A2A/releases.atom",
  "https://github.com/anthropics/skills/commits.atom",
  "https://github.com/agentclientprotocol/agent-client-protocol/releases.atom",
  "https://go.dev/blog/feed.atom",
  "https://github.com/renovatebot/renovate/releases.atom",
  "https://github.com/dependabot/dependabot-core/releases.atom",
  "https://github.com/OpenHands/OpenHands/releases.atom"]'''

# The kill switch, checked first every tick: any finding → this tick only
# observes and reports; every act is refused.
[[pause]]
name = "kill-switch"
run  = { builtin = "github-pause" }

[[observe]]
name = "issues"                          # open issues → kind "issue"; actionable ones get work-issue (one at a time) or delegate
run  = { builtin = "github-issues" }

[[observe]]
name = "prs"                             # open PRs → merge-pr (own, Dependabot, trusted; green), review-pr (outside; once per head), a fix round on red drafts
run  = { builtin = "github-prs" }

[[observe]]
name = "main"                            # CI on main (red → "check", high; revert-pr when Warden's merge broke it), unreleased merged PRs → release,
                                         # the release workflow, reverts of Warden's PRs (the experiment log); a newly published release's
                                         # CHANGELOG section goes to the "Warden digest" issue once
run  = { builtin = "github-main" }

[[observe]]
name = "experiment"                      # task records in the state, no open warden/experiment-* PR, not published today → publish-log
run  = { builtin = "github-experiment" }

[[observe]]
name = "roadmap"                         # once an ISO week (on or after roadmap_day, no open warden/roadmap-* PR) → roadmap; Warden's own RFCs past rfc_wait_hours with no objection → rfc-accept
run  = { builtin = "github-roadmap" }

[[act]]
name   = "work-issue"                    # a branch warden/issue-N-slug from main, the brain edits files only, a (draft) PR "Closes #N"
run    = { builtin = "work-issue" }
floors = { reversible = true, where = "worktree", needs_brain = true, clean_env = true, max_per_day = 10 }

[[act]]
name   = "review-pr"                     # one COMMENT review per head SHA from the diff and CI; never approves, never merges, never runs the code
run    = { builtin = "review-pr" }
floors = { reversible = true, needs_brain = true, max_per_day = 20 }

[[act]]
name   = "merge-pr"                      # squash-merge: own/Dependabot/trusted only, every check green, mergeable, no needs-human, no protected path
run    = { builtin = "merge-pr" }
floors = { untrusted = "deny", max_per_day = 30 }

[[act]]
name   = "release"                       # a release PR with CHANGELOG.md from merged PR titles (no model), then the tag on its merge commit (with canary: rc first)
run    = { builtin = "release" }
floors = { untrusted = "deny", max_per_day = 4 }

[[act]]
name   = "delegate"                      # hand an issue to another agent with params.delegate_cmd; the work comes back as a PR
run    = { builtin = "delegate" }
floors = { max_per_day = 5 }

[[act]]
name   = "pickup-branch"                 # a delegate's pushed branch becomes a PR under the merge rules
run    = { builtin = "pickup-branch" }
floors = { untrusted = "deny", max_per_day = 5 }

[[act]]
name   = "publish-log"                   # the experiment log rendered from the state (no model) into experiment_doc, a PR warden/experiment-DAY touching only it
run    = { builtin = "publish-log" }
floors = { untrusted = "deny", max_per_day = 2 }

[[act]]
name   = "revert-pr"                     # main red right after a merge of Warden's (main green on its parent): warden/revert-<sha>, a PR "Revert …", merged on green
run    = { builtin = "revert-pr" }
floors = { untrusted = "deny", max_per_day = 3 }

[[act]]
name   = "roadmap"                       # inputs gathered without a model, fenced; the brain answers one JSON object → ROADMAP.md in a ready PR (warden, roadmap) + up to roadmap_max_issues issues (RFCs without the warden label)
run    = { builtin = "roadmap" }
floors = { reversible = true, needs_brain = true, max_per_day = 1 }

[[act]]
name   = "rfc-accept"                    # an RFC that waited rfc_wait_hours with no comment from anyone else and no needs-human/wontfix/question label gets the warden label
run    = { builtin = "rfc-accept" }
floors = { reversible = true, max_per_day = 3 }
