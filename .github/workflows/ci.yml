name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # daily on main: a new advisory (govulncheck) turns main red without a push
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 lets only AppArmor-profiled programs create user namespaces;
          # lift that on this throwaway runner so bwrap can start.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if bwrap --ro-bind / / true; then
            echo "bwrap works: the sandbox tests run"
          else
            echo "::warning::bwrap cannot start on this runner; sandbox tests skip and acts are refused"
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  coverage:
    # total coverage must not drop by more than 0.1 points against the latest green main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the baseline artifact of main's run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test -race -count=1 -coverprofile=cover.out -covermode=atomic ./...
      - run: go tool cover -func=cover.out > cover.txt
      - name: Record (a push to main)
        if: github.event_name == 'push'
        run: go run ./scripts/covergate -func cover.txt -sha "$GITHUB_SHA" -out coverage.json
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.json
          retention-days: 90
      - name: Baseline (the latest green push to main)
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --branch main --event push --workflow CI --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run-id=$id" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request' && steps.base.outputs.run-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true # an expired artifact is no baseline: covergate passes with a notice
        with:
          name: coverage
          path: base
          run-id: ${{ steps.base.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Compare with main
        if: github.event_name == 'pull_request'
        run: go run ./scripts/covergate -func cover.txt -base base/coverage.json -max-drop 0.1

  fuzz:
    # every Go fuzz target (func FuzzX) for 20s; a crasher lands in testdata/fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sh scripts/fuzz.sh
        env:
          FUZZTIME: 20s

  demos:
    # end-to-end runs without a model; demo-go-project.sh talks to the real OSV and Go proxy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Sandbox
        id: sandbox
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bubblewrap
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            if bwrap --ro-bind / / true; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip (no sandbox)
        if: steps.sandbox.outputs.ok != 'true'
        run: echo "::warning::no working sandbox on this runner; the demos act and would be refused, so they are skipped"
      - name: demo-k8s (fixture, no cluster)
        if: steps.sandbox.outputs.ok == 'true'
        run: sh scripts/demo-k8s.sh
      - name: demo-go-project (real OSV and Go proxy)
        if: steps.sandbox.outputs.ok == 'true'
        run: sh scripts/demo-go-project.sh
      - name: demo-macos (dry-run)
        if: runner.os == 'macOS'
        run: sh scripts/demo-macos.sh

  build:
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "warden-${GOOS}-${GOARCH}" ./cmd/warden
