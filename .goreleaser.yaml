# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: warden

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: warden
    main: ./cmd/warden
    binary: warden
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nenkoru/warden/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: warden
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - INSTALL.md
      - CHANGELOG.md
      - packs/**/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive        # one SPDX SBOM per archive, made by syft

git:
  # vX.Y.Z and its vX.Y.Z-rc.N share a commit (the canary gate): the rc sorts
  # before the release, and the workflow names the tag it builds
  # (GORELEASER_CURRENT_TAG in release.yml)
  prerelease_suffix: "-"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false                # published: self-update never sees drafts; the canary gate replaces the review
  prerelease: auto
